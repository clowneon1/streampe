<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #alert-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
    }
    .alert-card {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-left: 4px solid #00d4ff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 10px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
      animation: slideIn 0.4s ease, fadeOut 0.5s ease 4.5s forwards;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .alert-card.payment {
      border-left-color: #00ff88;
      box-shadow: 0 4px 20px rgba(0,255,136,0.3);
    }
    .app-icon {
      width: 36px;
      height: 36px;
      background: #00d4ff22;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .alert-card.payment .app-icon { background: #00ff8822; }
    .alert-content { flex: 1; overflow: hidden; }
    .app-name {
      font-size: 11px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .alert-card.payment .app-name { color: #00ff88; }
    .alert-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(120%); }
    }
  </style>
</head>
<body>
  <div id="alert-container"></div>

  <script>
    const PAYMENT_PACKAGES = [
      'com.google.android.apps.nbu.paisa.user', // GPay
      'net.one97.paytm',                         // Paytm
      'com.phonepe.app',                         // PhonePe
      'in.org.npci.upiapp',                      // BHIM
      'com.amazon.mShop.android.shopping',       // Amazon Pay
    ];

    const PAYMENT_EMOJIS = ['💰','💸','🤑','✅'];

    const wsUrl = `ws://${location.hostname}:${location.port}`;
    let ws;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => console.log('[OBS] Connected to server');

      ws.onmessage = (event) => {
        const notif = JSON.parse(event.data);
        showAlert(notif);
      };

      ws.onclose = () => {
        console.log('[OBS] Disconnected, retrying in 3s...');
        setTimeout(connect, 3000);
      };
    }

    function showAlert(notif) {
      const container = document.getElementById('alert-container');
      const isPayment = PAYMENT_PACKAGES.includes(notif.packageName);

      const card = document.createElement('div');
      card.className = `alert-card${isPayment ? ' payment' : ''}`;

      const emoji = isPayment
        ? PAYMENT_EMOJIS[Math.floor(Math.random() * PAYMENT_EMOJIS.length)]
        : '🔔';

      card.innerHTML = `
        <div class="app-icon">${emoji}</div>
        <div class="alert-content">
          <div class="app-name">${escHtml(notif.appName || notif.packageName)}</div>
          <div class="alert-title">${escHtml(notif.title || '')}</div>
          <div class="alert-text">${escHtml(notif.text || '')}</div>
        </div>
      `;

      container.appendChild(card);

      // Remove after animation completes (5s)
      setTimeout(() => card.remove(), 5000);
    }

    function escHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    connect();
  </script>
</body>
</html>
