<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Alerts for OBS</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="shortcut icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0d111a;
      --surface-card: #161b26;
      --surface-hover: #1f2636;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #00e5ff;
      --accent-hover: #33ebff;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .app-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .app-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .section-card {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      outline: none;
      font-family: monospace;
    }

    .btn-copy {
      background: var(--surface-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 5px 0;
      transition: opacity 0.2s ease;
    }

    .checkbox-row:hover {
      opacity: 0.9;
    }

    .checkbox-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .checkbox-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .checkbox-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Simple Modern Custom Checkbox */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      outline: none;
      flex-shrink: 0;
      transition: all 0.2s ease;
      display: grid;
      place-content: center;
    }

    .custom-checkbox:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .custom-checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .custom-checkbox:checked::before {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 229, 255, 0.3);
      transition: all 0.2s ease;
      text-decoration: none;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.45);
      transform: translateY(-1px);
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 229, 255, 0.4);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <div class="header-card">
      <img src="/icon.png" alt="Logo" class="app-logo" />
      <div class="header-info">
        <div class="app-name">Payment Alerts for OBS</div>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Server Active</span>
        </div>
      </div>
    </div>

    <!-- Connection URL Card -->
    <div class="section-card">
      <span class="card-title">Mobile &amp; OBS Connection URL</span>
      <div class="input-row">
        <input type="text" id="input-connection-url" class="url-input" readonly value="Loading Connection URL..." />
        <button type="button" class="btn-copy" id="btn-copy-url">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      </div>
    </div>

    <!-- Settings Group Card -->
    <div class="section-card">
      <span class="card-title">System Preferences</span>

      <label class="checkbox-row" for="chk-start-startup">
        <div class="checkbox-label">
          <span class="checkbox-title">Start on Windows Boot</span>
          <span class="checkbox-sub">Automatically launch server when system starts</span>
        </div>
        <input type="checkbox" id="chk-start-startup" class="custom-checkbox" />
      </label>

      <label class="checkbox-row" for="chk-start-minimized">
        <div class="checkbox-label">
          <span class="checkbox-title">Start Minimized to Tray</span>
          <span class="checkbox-sub">Launch directly in the background on startup</span>
        </div>
        <input type="checkbox" id="chk-start-minimized" class="custom-checkbox" />
      </label>
    </div>

    <!-- Action Button -->
    <button type="button" class="btn-primary" id="btn-open-control-panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open Control Panel in Browser
    </button>

  </div>

  <div id="toast">Copied to clipboard!</div>

  <script src="js/app.js"></script>
</body>
</html>
